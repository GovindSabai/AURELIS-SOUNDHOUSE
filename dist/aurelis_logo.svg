<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <!-- Soundwaves -->
  <g fill="url(#grad2)">
    <rect x="20" y="45" width="2" height="10" />
    <rect x="25" y="40" width="2" height="20" />
    <rect x="30" y="35" width="2" height="30" />
    <rect x="35" y="30" width="2" height="40" />
    <rect x="40" y="40" width="2" height="20" />
  </g>
  <!-- Circle segment -->
  <path d="M 60 20 A 30 30 0 1 0 70 80" fill="none" stroke="#e0a96d" stroke-width="2" />
  <!-- Triangle -->
  <polygon points="50,30 50,70 80,50" fill="#d4af37" />
  <!-- More Soundwaves -->
  <g fill="url(#grad2)">
    <rect x="85" y="40" width="2" height="20" />
    <rect x="90" y="30" width="2" height="40" />
    <rect x="95" y="20" width="2" height="60" />
    <rect x="100" y="15" width="2" height="70" />
    <rect x="105" y="25" width="2" height="50" />
    <rect x="110" y="35" width="2" height="30" />
    <rect x="115" y="40" width="2" height="20" />
  </g>
  
  <!-- Text -->
  <text x="130" y="65" font-family="sans-serif" font-size="40" font-weight="bold" fill="none" stroke="white" stroke-width="1" letter-spacing="4">AURELIS</text>

  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a90e2;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
